name: Tests

# Day-one config. Cheap to get right now, awkward to retrofit.
#
#   * `push` on the default branch and nothing else. A push to a topic branch
#     with no open PR triggers nothing at all; the PR is what asks for a run.
#   * `pull_request` on its default events (opened, synchronize, reopened).
#   * One concurrency group per ref, cancelling superseded runs everywhere
#     except the default branch — where each commit's result is a record worth
#     keeping rather than a preview to be replaced.
#   * TWO jobs, from one matrix, which is a deliberate break of the ONE-job
#     rule this comment used to state. That rule is about the METER — GitHub
#     rounds billing per job, so splitting a ~20s suite for tidiness doubles a
#     bill and buys nothing — and it was always scoped to parallelism. The
#     second rung buys COVERAGE, a different axis: it is the only thing in this
#     repository that has ever run the suite on an interpreter other than 3.10.
#
# This repository is public, so Actions minutes are free and none of the above
# is about the meter. It is about the run being legible and the config being
# right before it matters.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  suite:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both rungs run to completion. A failure on one interpreter and not the
      # other is the interesting result, and cancelling the sibling throws away
      # the half of the comparison that makes it readable.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    # The job is ~20s. GitHub's default is 360 MINUTES, which is what a
    # hung apt mirror or a wedged ffmpeg would actually consume before
    # anyone noticed; cancel-in-progress does not help, the group is
    # per-ref. 10 leaves room for a slow runner without leaving room for
    # a stuck one.
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Pinned to a commit rather than a tag: a tag can be re-pointed at
        # any commit at any time, and this is the step that decides what
        # code the rest of the job runs. Bumping it is a deliberate edit.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        # 3.10 is the TOOLCHAIN floor, not the language floor. moviola's own
        # scripts parse and run under 3.7; what sets the floor is the test
        # toolchain — pytest 9.1.1 and yt-dlp 2026.8.19 both declare
        # `Requires-Python: >=3.10`, so below it the suite's own dependencies
        # will not install. AGENTS.md and README.md declare 3.10+ to match.
        #
        # Both rungs were run locally before this landed rather than published
        # as a guess: 1019 passed on 3.10.12 and 1019 on CPython 3.13.13, each
        # against exactly the hash-pinned set below, and the 3.13 install was
        # checked to resolve six packages — `exceptiongroup`, `tomli` and
        # `typing-extensions` correctly excluded by their markers.
        #
        # That count is a SNAPSHOT of this branch, not an invariant, and it went
        # stale TWICE inside the branch that introduced it. First at 993: the
        # review commit added twenty tests and left this sentence alone. Then at
        # 1013, which is the interesting one — that correction was measured and
        # written, and then five more test cases were appended to the same file
        # in the same commit, so the sentence shipped already false rather than
        # drifting into falsehood later.
        #
        # Twice is not bad luck, it is an ORDERING defect: measure, then edit,
        # then commit. So the number is now taken AFTER the last edit and
        # immediately before the commit, which is the only order in which
        # "run locally before this landed" is a true sentence. If `pytest -q`
        # prints a different number today, the likely reason is that somebody
        # added tests, not that a rung broke.
        #
        # Nothing asserts this number and nothing should. A test pinning the
        # suite's own size fails on every commit that adds a test, which teaches
        # people to edit the expected value without reading what it meant — the
        # opposite of what it was for. What IS asserted is the pair of VERSIONS,
        # by test_the_documented_interpreters_are_the_ones_the_matrix_runs: a
        # rung is a lasting claim, a pass count is a measurement with a date.
        #
        # NON-GOAL: 3.11 and 3.12 are deliberately untested. These two are the
        # floor and the ceiling; a version in between failing while both ends
        # pass is possible and nothing here would catch it. Two rungs is what
        # buys the most per run, not what buys everything.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        # conftest.py synthesizes every fixture clip by shelling out to ffmpeg,
        # and the frame tests call ffprobe. Without these the fixtures raise —
        # they do not skip — so this failing is loud.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install test dependencies
        # yt-dlp is a DEV dependency, not a runtime one: moviola shells out to
        # the binary and never imports the package. It is here because
        # tests/test_the_fallback_stays_small.py drives yt-dlp's own
        # build_format_selector to prove the format ladder is monotonic, and
        # guards that import. Without it those 24 tests skip and the run is
        # still green — which is the whole failure this workflow exists to
        # stop. tests/test_ci_runs_the_whole_suite.py enforces the coupling,
        # and follows the `-r` out of this file to do it.
        #
        # Pinned by version AND by hash, so what runs here is decided by this
        # repository at commit time rather than by whatever PyPI resolves to at
        # job time. requirements-ci.txt carries the reasoning and the
        # non-goals. Movement is not ignored, it is reported separately:
        # drift.yml installs the same two packages unpinned, weekly.
        #
        # TWO installs in this job are unpinned, and this comment claimed to be
        # the only one for a revision. `--upgrade pip` is deliberate: it is the
        # tool that ENFORCES the hashes below, and it never enters the
        # environment the suite imports from.
        #
        # It COULD be pinned. The runner's preinstalled pip is able to install a
        # hash-pinned pip, so "pinning the checker with the checker" is a
        # two-stage bootstrap rather than the circle this comment used to call
        # it — the earlier wording argued the pin was impossible when it is
        # merely a trade. It is not taken because it buys a decided pip version
        # at the price of running the suite against a pip nobody here has run it
        # against, and a green gate is worth more than a pinned checker.
        # TODOS.md carries it as a deferral rather than leaving the reason
        # sitting in a comment.
        #
        # The other unpinned install is `apt-get install ffmpeg`, in the step
        # above. It is not a PyPI package and nothing in requirements-ci.txt can
        # reach it; the file's own NON-GOALS say so, and TODOS.md carries that
        # too. Neither is a hole this file is hiding — but "the one unpinned
        # install" was a sentence that made a reader stop looking.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip list

      - name: Run the suite
        # -rs prints the reason for every skip. Disclosure, not enforcement:
        # the enforcement is test_ci_runs_the_whole_suite.py, which fails the
        # suite when the workflow stops installing something the suite guards
        # an import on. This flag is what makes an unexpected skip visible to
        # a human reading the log.
        run: python -m pytest -q -rs
